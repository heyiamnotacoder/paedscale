name: tests

# Deterministic core only: no API key, no network. pytest discovers every
# tests/test_*.py function, so a new test cannot be silently skipped. The live
# agent eval (tests/test_agent.py) needs ANTHROPIC_API_KEY + PubMed/openFDA and
# is excluded here.
on:
  push:
    branches: [master, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Deterministic tests (engine, scorers, safety stops, uncertainty, HI facades)
        run: python -m pytest -q tests --ignore=tests/test_agent.py
